# Open-weight replica of the GPT-5.2 structured-evidence pilot.
# The physical scenarios, treatments, prompt construction, elicitation regimes,
# repeats, randomization, endpoint, parsing, scoring, and analysis are unchanged.

experiment_name: pilot_qwen3_14b

scenarios:
  count: 30
  year: 2026
  seed: 20260815
  include_case_000: true

treatments:
  families: [neutral, excited_positive, skeptical_negative]
  variants_per_family: 2

evidence_modes: [structured]
elicitation_modes: [naturalistic, separated]

sampling:
  repeats: 2
  temperature: 0.7
  max_tokens: 2000

run:
  max_cost_usd: 1.0
  concurrency: 8
  retries: 3
  retry_backoff_s: 2.0
  shuffle_seed: 7

experiments:
  primary: true
  evidence_update: false
  commitment: false
  web: false

models_config: configs/models.qwen3_14b.yaml
data_dir: data
results_dir: results
