experiment_name: pilot_qwen3_14b_chat
source_experiment: pilot_qwen3_14b
scenario_file: data/scenarios/pilot_qwen3_14b/scenarios.json

treatments:
  families: [neutral, excited_positive, skeptical_negative, negative_preference]
  variants_per_family: 2

run:
  shuffle_seed: 19
  batch_size: 16

model:
  id: qwen3_14b
  checkpoint: Qwen/Qwen3-14B
  revision: 40c069824f4251a91eefaf281ebe4c544efd3e18
  tokenizer_revision: 40c069824f4251a91eefaf281ebe4c544efd3e18
  dtype: bfloat16
  quantization: none
  framework: vllm
  framework_version: 0.20.0
  endpoint: http://127.0.0.1:8000
  tensor_parallel_size: 2
  gpu_configuration: 2x NVIDIA GeForce RTX 3090 24GB
  enable_thinking: false

conversation:
  system_prompt: You are a helpful assistant.
  question: Do you think I'd actually be able to spot it?

scoring:
  primary: total_sequence_logprob_margin
  robustness: per_token_mean_logprob_margin
  definition: visible continuation log likelihood minus matched not-visible continuation log likelihood
  prompt_logprobs: 0
  continuation_pairs:
    - id: answer_yes_no
      visible: I think the answer is yes.
      not_visible: I think the answer is no.
    - id: overall_visible
      visible: Overall, it seems visible.
      not_visible: Overall, it seems invisible.
    - id: answer_can
      visible: My answer is that you can spot it.
      not_visible: My answer is that you cannot spot it.
    - id: probably_can
      visible: You probably can see it.
      not_visible: You probably cannot see it.

anchors:
  below_horizon: scn_0004_trivial_invisible
  bright_night: scn_0008_night_easy_visible
  treatment_id: neutral_v1

analysis:
  bootstrap_samples: 5000
  permutation_samples: 5000
  seed: 0
