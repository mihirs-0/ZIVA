[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziva"
version = "0.1.0"
description = "ZIVA: Zero-shot Inferences of Visual Affordances - a benchmark for valence-invariance of factual perceptual estimates in language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZIVA authors" }]
dependencies = [
    "astronomy-engine>=2.1.19,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "Pillow>=10.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "typer>=0.9",
    "tzdata>=2024.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
ziva = "ziva.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
